# Fetches the run's GitHub OIDC identity token for Workload Identity Federation and points the Claude Code CLI at it:
# the CLI exchanges it for a short-lived Anthropic access token itself (it reads ANTHROPIC_FEDERATION_RULE_ID,
# ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID, ANTHROPIC_WORKSPACE_ID and ANTHROPIC_IDENTITY_TOKEN_FILE).
# The workflow needs `id-token: write` and the four ANTHROPIC_* identifiers in its environment; they are not secrets.
# A GitHub token is single use (its `jti` is accepted once) and lives about five minutes, so run this right before
# every step that starts the CLI, and never exchange the token here: that would spend it before the CLI can.
name: Anthropic identity token
description: Fetches the run's GitHub OIDC token into a file and exports ANTHROPIC_IDENTITY_TOKEN_FILE for the Claude Code CLI's federation exchange.
runs:
  using: composite
  steps:
    - name: Fetch the GitHub OIDC token for the CLI's federation exchange
      shell: bash
      run: |
        set -euo pipefail
        for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_WORKSPACE_ID; do
          if [ -z "${!v:-}" ]; then
            echo "::error title=Workload Identity Federation::$v is not set in the workflow environment."
            exit 1
          fi
        done
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error title=Workload Identity Federation::No OIDC token endpoint: the job needs the id-token: write permission."
          exit 1
        fi
        if [ -n "${ANTHROPIC_API_KEY:-}" ] || [ -n "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
          echo "::error title=Workload Identity Federation::ANTHROPIC_API_KEY or ANTHROPIC_AUTH_TOKEN is set; it would shadow federation. Unset it."
          exit 1
        fi
        jwt="$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r '.value // empty')"
        if [ -z "$jwt" ]; then
          echo "::error title=Workload Identity Federation::GitHub returned no OIDC token."
          exit 1
        fi
        echo "::add-mask::$jwt"
        file="$(mktemp "${RUNNER_TEMP:-/tmp}/anthropic-identity-token.XXXXXX")"
        printf '%s' "$jwt" > "$file"
        echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$file" >> "$GITHUB_ENV"
        sub="$(printf '%s' "$jwt" | cut -d. -f2 | tr '_-' '/+' | awk '{ l = length($0) % 4; if (l) $0 = $0 substr("==", 1, 4 - l); print }' | base64 -d 2>/dev/null | jq -r '.sub // "?"')"
        echo "Fetched a GitHub identity token (sub $sub) into $file for the CLI's federation exchange as service account $ANTHROPIC_SERVICE_ACCOUNT_ID."
