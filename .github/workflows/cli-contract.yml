# Nightly: parse the stream-json output of the newest `claude` CLI with Tandem's protocol decoder, and load the
# transcripts it writes to disk with Tandem's transcript reader. Catches protocol drift before users do.
# Needs an ANTHROPIC_API_KEY repository secret (a low-budget key).
name: CLI contract

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'daarko10/tandem' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Install latest Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Record live transcripts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=CLI contract::No ANTHROPIC_API_KEY repository secret: add one (a low-budget key) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p build/contract
          ./scripts/record-fixture.sh contract-hello "Reply with the single word: pong" build/contract
      # Tandem names every new session with --session-id and drops inherited session variables (docs/protocol.md 1.2).
      # This checks that the id passed with --session-id names the session and its transcript while one is inherited.
      # Measured with 2.1.301: CLAUDE_CODE_SESSION_ID on its own is ignored; the CLI used an inherited id only inside a
      # hosted session, whose other variables a runner does not have.
      - name: Check --session-id with an inherited CLAUDE_CODE_SESSION_ID
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_SESSION_ID: bogus
        run: |
          session_id=11111111-1111-4111-8111-111111111111
          work="$(mktemp -d)"
          (cd "$work" && claude -p "Reply with the single word: pong" --output-format stream-json --verbose --safe-mode --session-id "$session_id" < /dev/null > raw.ndjson)
          # system/init must report the id passed with --session-id. Lines that are not JSON are skipped, as Tandem skips them.
          python3 -I - "$work/raw.ndjson" "$session_id" <<'PY'
          import json, sys
          def parsed(line):
              try:
                  return json.loads(line)
              except ValueError:
                  return None
          init = next((m for m in map(parsed, open(sys.argv[1], encoding="utf-8"))
                       if isinstance(m, dict) and m.get("type") == "system" and m.get("subtype") == "init"), {})
          assert init.get("session_id") == sys.argv[2], f"system/init session_id is {init.get('session_id')!r}"
          PY
          python3 -I scripts/copy_transcript.py "$work" "$work/raw.ndjson" build/contract/transcripts session-id
      - name: Decode with Tandem's protocol layer and load the transcripts with its reader
        run: ./gradlew test --tests '*ContractTest*' -Dtandem.contractDir=build/contract
