# Nightly: parse the stream-json output of the newest `claude` CLI with Tandem's protocol decoder, and load the
# transcripts it writes to disk with Tandem's transcript reader. Catches protocol drift before users do.
# Authenticates with Workload Identity Federation: .github/actions/anthropic-token fetches the run's GitHub OIDC token,
# and the CLI exchanges it for a ten-minute Anthropic access token bound to the tandem-ci service account, so no API
# key is stored in the repository. The federation rule in the Claude Console admits only runs on main of daarko10/tandem.
name: CLI contract

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      drift:
        description: "Rehearse the drift loop: mutate this run's own recording (init-model-key or transcript-content-key) so Drift fix fires as for a real red; empty for a real run"
        type: string
        default: ""

permissions:
  id-token: write # the job fetches its GitHub OIDC token
  contents: read

env:
  ANTHROPIC_FEDERATION_RULE_ID: fdrl_019BGJmAMDiAL6DmAQENbhfk
  ANTHROPIC_ORGANIZATION_ID: 8336fe5f-a7f7-4255-9fe0-7f594d5a8ec8
  ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01F45vdtRBnPSRZHXY8ek1fn
  ANTHROPIC_WORKSPACE_ID: wrkspc_012JJzfEG8tDKeta7pe3CCa5

jobs:
  contract:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'daarko10/tandem' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v6
      - name: Install latest Claude Code
        run: npm install -g @anthropic-ai/claude-code && claude --version
      - name: Fetch an identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record live transcripts
        run: |
          mkdir -p build/contract
          ./scripts/record-fixture.sh contract-hello "Reply with the single word: pong" build/contract
      # The recording cannot be judged by the decoder alone: a run whose API call failed still has an init and a result.
      # A reply that came under another type (no assistant line while the result holds the reply text) is a renamed
      # core type, which ContractTest alone would pass: it is a red of its own, so drift-fix.yml fixes it as decoder
      # drift instead of reporting it as a run the CLI did not answer.
      - name: Check that the CLI authenticated and answered
        run: |
          python3 -I - build/contract/contract-hello.ndjson <<'PY'
          import json, sys
          def command(text):
              # A workflow command ends at the line's end; GitHub's escapes keep a multi-line detail in one annotation.
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          lines = [json.loads(l) for l in open(sys.argv[1], encoding="utf-8") if l.strip()]
          init = next((m for m in lines if m.get("type") == "system" and m.get("subtype") == "init"), {})
          result = next((m for m in lines if m.get("type") == "result"), {})
          print(f"init: model={init.get('model')!r} apiKeySource={init.get('apiKeySource')!r}; "
                f"result: subtype={result.get('subtype')!r} is_error={result.get('is_error')!r}; "
                f"assistant lines: {sum(1 for m in lines if m.get('type') == 'assistant')}")
          has_reply = any(m.get("type") == "assistant" for m in lines)
          text = result.get("result") if isinstance(result.get("result"), str) else ""
          if result.get("is_error") or not (has_reply or text):
              detail = text or json.dumps(result.get("errors", result))
              print(f"::error title=CLI contract::The CLI did not answer: {command(str(detail)[:400])}")
              sys.exit(1)
          if not has_reply:
              print("::error title=CLI contract::No assistant line although the result holds text: a core type may have been renamed; see the recording.")
              sys.exit(1)
          PY
      # Tandem names every new session with --session-id and drops inherited session variables (docs/protocol.md 1.2).
      # This checks that the id passed with --session-id names the session and its transcript while one is inherited.
      # Measured with 2.1.301: CLAUDE_CODE_SESSION_ID on its own is ignored; the CLI used an inherited id only inside a
      # hosted session, whose other variables a runner does not have.
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Check --session-id with an inherited CLAUDE_CODE_SESSION_ID
        env:
          CLAUDE_CODE_SESSION_ID: bogus
        # The transcript is redacted before upload, as record-fixture.sh redacts its own: drift-fix.yml promotes the
        # artifact to a fixture, and the fixtures will be public (docs/launch.md, tactic 4). The raw copy stays in the
        # temporary directory.
        run: |
          session_id=11111111-1111-4111-8111-111111111111
          work="$(mktemp -d)"
          (cd "$work" && claude -p "Reply with the single word: pong" --output-format stream-json --verbose --safe-mode --session-id "$session_id" < /dev/null > raw.ndjson)
          # system/init must report the id passed with --session-id. Lines that are not JSON are skipped, as Tandem skips them.
          python3 -I - "$work/raw.ndjson" "$session_id" <<'PY'
          import json, sys
          def parsed(line):
              try:
                  return json.loads(line)
              except ValueError:
                  return None
          init = next((m for m in map(parsed, open(sys.argv[1], encoding="utf-8"))
                       if isinstance(m, dict) and m.get("type") == "system" and m.get("subtype") == "init"), {})
          assert init.get("session_id") == sys.argv[2], f"system/init session_id is {init.get('session_id')!r}"
          PY
          python3 -I scripts/copy_transcript.py "$work" "$work/raw.ndjson" "$work/transcripts" session-id
          mkdir -p build/contract/transcripts
          python3 -I scripts/redact_fixture.py "$work/transcripts/session-id.jsonl" build/contract/transcripts/session-id.jsonl
      # What Tandem reads beyond a plain turn (launch.md tactic 7), each checked by ContractTest: the MCP requests and their
      # answers, an MCP tool call's request and the slash-command catalogue and local commands, against
      # scripts/mcp_probe_servers.py's local servers (mcp-slash, mcp-status, mcp-tool-call), and the shell-escape frames with
      # their zero-turn results (bash-mode, bash-mode-respond, and bash-mode-context, the one frame Tandem sends with replies
      # off). Each scenario starts the CLI once, so each is a step of its own with a fresh identity token: a GitHub token is
      # single use and lives about five minutes (.github/actions/anthropic-token).
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record the mcp-slash scenario
        run: ./scripts/record-scenario.sh mcp-slash build/contract
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record the mcp-status scenario
        run: ./scripts/record-scenario.sh mcp-status build/contract
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record the mcp-tool-call scenario
        run: ./scripts/record-scenario.sh mcp-tool-call build/contract
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record the bash-mode scenario
        run: ./scripts/record-scenario.sh bash-mode build/contract
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record the bash-mode-respond scenario
        run: ./scripts/record-scenario.sh bash-mode-respond build/contract
      - name: Fetch a fresh identity token for the CLI
        uses: ./.github/actions/anthropic-token
      - name: Record the bash-mode-context scenario
        run: ./scripts/record-scenario.sh bash-mode-context build/contract
      # The rehearsal of the drift loop: the live recording is mutated in place (all three files are read before any is
      # written) and a marker file names the mode, so the Gradle step goes red, the real artifact is uploaded and
      # drift-fix.yml fires through workflow_run exactly as for a real red. A scheduled run has no input and records as is.
      - name: Mutate the recording for a rehearsal
        if: inputs.drift != ''
        env:
          DRIFT: ${{ inputs.drift }}
        run: python3 -I scripts/make_drift.py "$DRIFT" build/contract --from build/contract
      - name: Decode with Tandem's protocol layer and load the transcripts with its reader
        run: ./gradlew test --tests '*ContractTest*' -Dtandem.contractDir=build/contract
      # The Gradle console names the failing test but not the assertion message (the file and the unrecognised types);
      # the message is in the JUnit XML. Printed as annotations, so a red run can be read without downloading anything.
      - name: Name the failed assertions
        if: failure()
        run: |
          python3 -I - build/test-results/test <<'PY'
          import glob, sys
          import xml.etree.ElementTree as ET
          def command(text):
              # A workflow command ends at the line's end; GitHub's escapes keep a multi-line message in one annotation.
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          for path in sorted(glob.glob(sys.argv[1] + "/TEST-*.xml")):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for failure in case.findall("failure"):
                      # Gradle writes Throwable.toString(), "<exception class>: <message>"; the class is not the message.
                      message, exception = failure.get("message") or "", failure.get("type") or ""
                      if exception and message.startswith(exception + ": "):
                          message = message[len(exception) + 2:]
                      print(f"::error title=CLI contract::{command((case.get('name') or '') + ': ' + message[:400])}")
          PY
      # The redacted recording, for a red run's diagnosis and for drift-fix.yml, which promotes it to a fixture.
      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-recording
          path: build/contract
          if-no-files-found: ignore
          retention-days: 14
