name: Release

# Run by the owner only, from Actions > Release > Run workflow on main (docs/marketplace.md). It builds and signs the plugin
# ZIP, drafts a GitHub release for it, and uploads it to the JetBrains Marketplace only when "publish" is ticked: the very
# first version goes to the Marketplace by hand on plugins.jetbrains.com, and publishPlugin can only update a listed plugin.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the signed ZIP to the JetBrains Marketplace
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Sign, draft and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Version and change notes
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n "s/^version *= *//p" gradle.properties)"
          [ -n "$version" ] || { echo "::error title=Release::no version in gradle.properties"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error title=Release::v$version is already tagged: raise the version in gradle.properties first"; exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error title=Release::CHANGELOG.md has no section for $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ./gradlew -q getChangelog --no-header --no-empty-sections --project-version="$version" > release-notes.md
      - name: Check
        run: ./gradlew check
      - name: Sign
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        # Two runs: in one, Gradle refuses verifyPluginSignature for reading signPlugin's output without a declared dependency.
        run: |
          ./gradlew signPlugin
          ./gradlew verifyPluginSignature
      - uses: actions/upload-artifact@v7
        with:
          name: signed-plugin
          path: ./build/distributions/*-signed.zip
      - name: Draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" build/distributions/*-signed.zip \
            --draft --target "$GITHUB_SHA" --title "Tandem $VERSION" --notes-file release-notes.md
      - name: Publish to the JetBrains Marketplace
        if: inputs.publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin
