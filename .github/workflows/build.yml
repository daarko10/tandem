name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        shell: bash
        run: set -o pipefail; ./gradlew check 2>&1 | tee check.log
      - name: Build plugin
        shell: bash
        run: set -o pipefail; ./gradlew buildPlugin 2>&1 | tee build.log
      # Compiler errors and failed tests as annotations, readable through the GitHub API.
      - name: Report build problems
        if: ${{ failure() }}
        shell: bash
        run: |
          cat check.log build.log 2>/dev/null \
            | grep -E '^e: |FAILED|What went wrong|> ' \
            | sort -u | head -n 40 \
            | while IFS= read -r line; do echo "::error title=Build::${line}"; done
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ./build/reports/tests

  verify:
    name: Plugin Verifier
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Verify against every supported IDE release
        run: ./gradlew verifyPlugin
      # Surface verifier problems as annotations, which are readable through the GitHub API
      # (log and artifact downloads are blocked in some sandboxes).
      - name: Report verifier problems
        if: ${{ failure() }}
        run: |
          find build/reports/pluginVerifier -type f \( -name '*.txt' -o -name '*.md' \) \
            | xargs -r grep -hiE 'problem|not found|unresolved|incompatib|deprecated|internal' \
            | sort -u | head -n 40 \
            | while IFS= read -r line; do echo "::error title=Plugin Verifier::${line}"; done
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: plugin-verifier-report
          path: ./build/reports/pluginVerifier
