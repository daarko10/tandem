name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the Gradle jobs run. A pull request that changes only paths no Gradle task reads (docs, scripts, skills, the
  # other workflows and their action, CODEOWNERS, README.md, CLAUDE.md, LICENSE) skips them; Script tests still runs. The
  # pattern names what may be skipped, not what runs, so src/, the build files, the wrapper, .gitignore, build.yml itself
  # and any new path run everything, and so does every push to main.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      gradle: ${{ steps.filter.outputs.gradle }}
    steps:
      # A pull request checks out its merge commit, whose first parent is the base branch.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Decide whether the Gradle jobs run
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "a $EVENT runs every job"; echo "gradle=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a file moved from src/ to docs/ lists both paths, so the move runs Gradle. A failed diff fails the job.
          files="$(git diff --no-renames --name-only HEAD^1 HEAD)"
          skip='^(docs/|scripts/|\.claude/|\.github/actions/|\.github/workflows/(cli-contract|drift-fix|macos-ide-test)\.yml$|\.github/CODEOWNERS$|README\.md$|CLAUDE\.md$|LICENSE$)'
          # grep -v exits 0 when some path is not skippable, 1 when every path is, and 2 or more on an error (a bad pattern): an error is red, never a skip.
          rc=0; grep -qvE "$skip" <<<"$files" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error title=Changes::grep failed with exit code $rc"; exit 1
          elif [ -n "$files" ] && [ "$rc" -eq 1 ]; then
            echo "$(wc -l <<<"$files") changed files, none read by Gradle: the Gradle jobs are skipped"
            echo "gradle=false" >> "$GITHUB_OUTPUT"
          else
            echo "gradle=true" >> "$GITHUB_OUTPUT"
          fi

  # The recording scripts' and the workflows' own tests: plain Python, no Gradle and no real claude. Every change runs them.
  scripts:
    name: Script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Script tests
        shell: bash
        run: cd scripts && python3 -m unittest -v

  build:
    name: Build and test
    needs: [ changes ]
    if: needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    steps:
      # The platform tests need room for the IDE, its caches and their VFS: a full runner fails them with "No space left on device".
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Test
        shell: bash
        run: set -o pipefail; ./gradlew check 2>&1 | tee check.log
      - name: Build plugin
        shell: bash
        run: set -o pipefail; ./gradlew buildPlugin 2>&1 | tee build.log
      # Compiler errors and failed tests as annotations, readable through the GitHub API.
      - name: Report build problems
        if: ${{ failure() }}
        shell: bash
        run: |
          cat check.log build.log 2>/dev/null \
            | grep -E '^e: |FAILED|What went wrong|> ' \
            | { grep -vE ' (STARTED|SKIPPED)[[:space:]]*$' || true; } \
            | sort -u | head -n 40 \
            | while IFS= read -r line; do echo "::error title=Build::${line}"; done
      - name: Report disk space
        if: ${{ failure() }}
        shell: bash
        run: |
          df -h
          du -sh ~/.gradle .intellijPlatform build 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: ./build/reports/tests
      # The test IDE's own logs (idea.log, thread dumps of timed-out tests, any leak heap dump) and the test JVM's GC log: what a
      # test, or the test application's close, waited on.
      - name: Upload test IDE logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ide-logs
          path: |
            ./.intellijPlatform/sandbox/*/*/log-test/
            ./build/test-gc.log*
          include-hidden-files: true
          if-no-files-found: ignore

  # The same unit, fixture and platform tests on a Mac, where the IDE gets launchd's PATH, temporary directories are links into
  # /private, the volume ignores case and the JDK's watch service polls. The IDE test runs on a Mac nightly and on demand only
  # (macos-ide-test.yml): a macOS runner costs about ten times a Linux one.
  build-macos:
    name: Build and test (macOS)
    needs: [ changes ]
    if: needs.changes.outputs.gradle == 'true'
    runs-on: macos-latest
    # A hung test once held this runner for the default 6 hours; a full run takes well under this.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # The fake CLI the tests run is a Python 3 script; the runner image has Python 3.
      - name: Test
        shell: bash
        run: |
          # If the tests are still running after 20 minutes, something hangs: print the test JVM's threads into this log.
          ( sleep 1200; for pid in $(pgrep -f 'Gradle Test Executor'); do echo "::group::jstack $pid"; jstack "$pid"; echo "::endgroup::"; done ) &
          python3 --version && set -o pipefail && ./gradlew check 2>&1 | tee check.log
      - name: Report build problems
        if: ${{ failure() }}
        shell: bash
        run: |
          cat check.log 2>/dev/null \
            | grep -E '^e: |FAILED|What went wrong|> ' \
            | { grep -vE ' (STARTED|SKIPPED)[[:space:]]*$' || true; } \
            | sort -u | head -n 40 \
            | while IFS= read -r line; do echo "::error title=Build (macOS)::${line}"; done
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos
          path: ./build/reports/tests
      - name: Upload test IDE logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-ide-logs-macos
          path: |
            ./.intellijPlatform/sandbox/*/*/log-test/
            ./build/test-gc.log*
          include-hidden-files: true
          if-no-files-found: ignore

  # The verifier and the IDE test build the plugin themselves and start alongside Build and test rather than after it: they
  # reuse nothing from it (a pull request's jobs never write the Gradle cache), so waiting only added its minutes.
  verify:
    name: Plugin Verifier
    needs: [ changes ]
    if: needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Verify against every supported IDE release
        shell: bash
        run: set -o pipefail; ./gradlew verifyPlugin 2>&1 | tee verify.log
      # Surface the verdict per IDE and each blocking problem as annotations, which are readable through the
      # GitHub API (log and artifact downloads are blocked in some sandboxes).
      - name: Report verifier problems
        if: ${{ failure() }}
        shell: bash
        run: |
          sed -E 's/^[[:space:]]+//' verify.log \
            | awk '/^Plugin .* against /{print; next}
                   /^(Compatibility problems|Internal API usages|Non-extendable API usages|Override-only API usages)/{keep=1; print; next}
                   /^[A-Z][A-Za-z -]*(usages|problems|Eligibility)/{keep=0}
                   keep && /^#/{print}' \
            | head -n 40 \
            | while IFS= read -r line; do echo "::error title=Plugin Verifier::${line}"; done
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: plugin-verifier-report
          path: ./build/reports/pluginVerifier

  # Each IDE test starts its own IDE (about 1.5 minutes or more), so the tests are split across three jobs that run side
  # by side: a job runs the tests whose position in their class, sorted by name, is its index modulo three (IdeTestShard).
  ide-test:
    name: IDE test (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [ changes ]
    if: needs.changes.outputs.gradle == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      # Starts a real IDE with the built plugin installed (IDE Starter + UI Driver); it needs a display.
      - name: Run the IDE test
        env:
          IDE_TEST_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1000x24" ./gradlew integrationTest -Dtandem.ideTestShard="$IDE_TEST_SHARD"
      - name: Report IDE test failures
        if: ${{ failure() }}
        shell: bash
        run: |
          grep -ho 'failure message="[^"]*' build/test-results/integrationTest/*.xml 2>/dev/null \
            | sed -E 's/^failure message="//; s/&#10;/ /g; s/\x1b\[[0-9;]*m//g; s/\?\[[0-9;]*m//g' \
            | cut -c1-400 | head -n 10 \
            | while IFS= read -r line; do echo "::error title=IDE test::${line}"; done
          find out/ide-tests -name idea.log -print0 2>/dev/null | xargs -0 -r grep -h 'Plugin: dev.daarkolabs.tandem' \
            | sort -u | head -n 10 | while IFS= read -r line; do echo "::error title=IDE log::${line}"; done
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ide-test-logs-${{ matrix.shard }}
          path: |
            out/ide-tests/tests/**/log/**
            build/reports/tests/integrationTest
