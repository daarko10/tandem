# Records the launch GIF (docs/launch.md, tactics 1 and 2) with scripts/demo/record.sh: the three scenes of DemoRecordingIdeTest, played in
# a real IDE against the fake CLI. Run it by hand after a UI change; the GIFs and MP4s are the artifact `demo`.
name: Demo recording

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    name: Record the demo
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The IDE under test, its caches and the recording need room.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          tool-cache: false
          large-packages: false
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Install ffmpeg and Xvfb
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb fonts-inter
      # No DISPLAY: the script starts its own 1600x1000 Xvfb and records it.
      - name: Record
        run: env -u DISPLAY scripts/demo/record.sh
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: demo
          path: build/demo
          if-no-files-found: error
      - name: Upload test IDE logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: demo-ide-logs
          path: out/ide-tests/tests/**/log/**
