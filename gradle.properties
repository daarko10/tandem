group = dev.daarkolabs.tandem
version = 0.4.0

# Lowest supported IDE build. 2026.1 (261) bundles Jewel, Compose and the runtime modules we need.
pluginSinceBuild = 261
# IDE the plugin compiles against. Keep it at the lowest supported release when one is pinned.
platformVersion = 2026.1.5

pluginRepositoryUrl = https://github.com/daarko10/tandem

# The platform bundles the Kotlin stdlib and kotlinx.coroutines. Never ship our own copies.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true
org.gradle.jvmargs = -Xmx3g
